<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: #333; }
        .header { border-bottom: 2px solid #2563eb; padding-bottom: 20px; margin-bottom: 30px; }
        .quote-title { font-size: 24px; font-weight: bold; color: #1e293b; }
        .quote-number { font-size: 14px; color: #64748b; }
        .details { margin-top: 40px; width: 100%; border-collapse: collapse; }
        .details th { text-align: left; padding: 10px; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .details td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .total { font-weight: bold; font-size: 18px; margin-top: 20px; text-align: right; }
    </style>
</head>
<body>
    <div class="header">
        <div class="quote-title">CRM Proposal</div>
        <div class="quote-number">Quote #: {{ quote.quote_number }}</div>
    </div>
    
    <div>
        <p><strong>Prepared for:</strong> {{ quote.deal.title }}</p>
        <p><strong>Status:</strong> {{ quote.status|title }}</p>
        <p><strong>Date:</strong> {% now "F j, Y" %}</p>
    </div>

    <table class="details">
        <tr>
            <th>Description</th>
            <th>Amount</th>
        </tr>
        <tr>
            <td>Software License & Implementation</td>
            <td>${{ quote.amount }}</td>
        </tr>
    </table>

    <div class="total">
        Total: ${{ quote.amount }}
    </div>
</body>
</html>
